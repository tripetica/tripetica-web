# Retired Bubble / test paths. Return 410 here so crawlers see Gone
# instead of a redirect or a Next.js 404. Do not Disallow these in robots.txt.
#
# Exact matches only for /about and /ops-panel so real locale routes
# (/tr/ops, /en/account, …) are never caught. Prefix is limited to
# /version-test and /version-test/… — not /version-testing.

location = /about { return 410; }
location = /about/ { return 410; }
location = /ops-panel { return 410; }
location = /ops-panel/ { return 410; }
location = /version-test { return 410; }
location ^~ /version-test/ { return 410; }
