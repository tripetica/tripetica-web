# Phase 2: install only after a certificate covering both names exists.
upstream tripetica_prod {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tripetica.com www.tripetica.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    include /etc/nginx/snippets/tripetica-bubble-gone.conf;

    # Single-hop HTTPS+apex. Root and Bubble ?lang= skip the extra / → /ru hop.
    location = / {
        if ($arg_lang ~* "^(tr|tr_tr)$") { return 301 https://tripetica.com/tr; }
        if ($arg_lang ~* "^(en|en_us)$") { return 301 https://tripetica.com/en; }
        if ($arg_lang ~* "^(ru|ru_ru)$") { return 301 https://tripetica.com/ru; }
        return 301 https://tripetica.com/ru;
    }

    location / {
        return 301 https://tripetica.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tripetica.com;

    ssl_certificate /etc/letsencrypt/live/tripetica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripetica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/tripetica-bubble-gone.conf;

    location = / {
        if ($arg_lang ~* "^(tr|tr_tr)$") { return 301 https://tripetica.com/tr; }
        if ($arg_lang ~* "^(en|en_us)$") { return 301 https://tripetica.com/en; }
        if ($arg_lang ~* "^(ru|ru_ru)$") { return 301 https://tripetica.com/ru; }
        return 301 https://tripetica.com/ru;
    }

    location / {
        return 301 https://tripetica.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tripetica.com;

    ssl_certificate /etc/letsencrypt/live/tripetica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripetica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/tripetica-bubble-gone.conf;

    location / {
        proxy_pass http://tripetica_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        client_max_body_size 10m;
    }
}
